<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Test de envío</title>
<style>
  body { font-family: sans-serif; background: #111; color: #fff; padding: 40px; text-align: center; }
  button { font-size: 18px; padding: 16px 32px; background: #df2d48; color: white; border: none; border-radius: 8px; cursor: pointer; }
  #resultado { margin-top: 30px; font-size: 18px; white-space: pre-wrap; text-align: left; max-width: 600px; margin-left: auto; margin-right: auto; background: #222; padding: 20px; border-radius: 8px; }
</style>
</head>
<body>

<h1>Test de envío del formulario</h1>
<p>Tocá el botón. Va a intentar mandar un mensaje de prueba y te va a mostrar exactamente qué pasó.</p>
<button id="btn">Probar envío</button>
<div id="resultado">Esperando...</div>

<script>
  const resultado = document.getElementById('resultado');
  document.getElementById('btn').addEventListener('click', async () => {
    resultado.textContent = 'Enviando...';
    try {
      const fd = new FormData();
      fd.append('fullName', 'Test desde pagina de diagnostico');
      fd.append('email', 'diagnostico@example.com');
      fd.append('message', 'Si ves esto en Formspree o en tu correo, el envio SI funciona desde tu navegador.');

      const res = await fetch('https://formspree.io/f/mbgllqaz', {
        method: 'POST',
        headers: { Accept: 'application/json' },
        body: fd,
      });

      const text = await res.text();
      resultado.textContent = 'RESULTADO:\n\nCodigo de respuesta: ' + res.status + '\n\nMensaje del servidor:\n' + text;
    } catch (err) {
      resultado.textContent = 'ERROR — el envio NO se pudo mandar.\n\nDetalle del error:\n' + err.message + '\n\n(Esto es justo lo que necesito ver, mandame una captura de este cartel)';
    }
  });
</script>

</body>
</html>
